[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "chebwin"
version = "1.0.0"
description = "Analysis code for 'Window design for exact conditional comparisons of sparse event counts under polynomial drift'"
readme = "README.md"
authors = [
    {name = "Jasmeet Singh Bindra"},
    {name = "Siddharth Panwar"},
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
analysis = [
    "pandas>=2.0",
    "pyarrow>=14",
    "joblib>=1.3",
    "h5py>=3.10",
    "mpmath>=1.3",
    "sympy>=1.12",
]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
